<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排产智能体平台 · APS Agent</title>
<style>
:root{
  --bg:#edf0f7;
  --ink:#1d2436;
  --ink-2:#525b70;
  --ink-3:#8b93a7;
  --line:rgba(29,36,54,.09);
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.82);
  --accent:#3a63c0;
  --accent-soft:rgba(58,99,192,.10);
  --ok:#2e9e6b;
  --warn:#d08a1d;
  --err:#d15454;
  --c-chicken:#4a7fd6;
  --c-duck:#35a2a5;
  --c-pig:#c98a3d;
  --c-aqua:#7c6fd0;
  --c-change:#9aa2b5;
  --r-lg:18px;
  --r-md:12px;
  --r-sm:8px;
  --shadow:0 8px 32px rgba(29,36,54,.08),0 1px 4px rgba(29,36,54,.05);
  --font:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
  font-size:14px;
  line-height:1.6;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;
}
body::before{width:560px;height:560px;background:rgba(96,138,220,.20);top:-180px;right:-120px}
body::after{width:480px;height:480px;background:rgba(120,180,200,.18);bottom:-160px;left:200px}
.app{position:relative;z-index:1;display:flex;height:100vh}

/* ---------- 左侧菜单栏 ---------- */
.sidebar{
  width:224px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  padding:20px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line)}
.brand-logo{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#3a63c0,#5d8ae0);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 4px 12px rgba(58,99,192,.35);
}
.brand-name{font-weight:600;font-size:14.5px;letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--ink-3);margin-top:-2px}
.menu{margin-top:14px;display:flex;flex-direction:column;gap:3px;flex:1}
.menu-label{font-size:11px;color:var(--ink-3);padding:10px 10px 4px;letter-spacing:.08em}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:var(--ink-2);cursor:pointer;font-size:13.5px;border:1px solid transparent;
  transition:all .18s;user-select:none;
}
.menu-item svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.menu-item:hover{background:rgba(255,255,255,.55)}
.menu-item.active{
  background:var(--glass-strong);color:var(--accent);font-weight:600;
  border-color:rgba(58,99,192,.18);box-shadow:var(--shadow);
}
.menu-item.active svg{opacity:1}
.menu-item.disabled{opacity:.42;cursor:not-allowed}
.menu-item.disabled:hover{background:none}
.menu-badge{margin-left:auto;font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 7px;font-weight:600}
.sidebar-user{
  display:flex;align-items:center;gap:10px;padding:12px 10px 2px;border-top:1px solid var(--line);
}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8aa5d8,#b6c6e8);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
.sidebar-user .u-name{font-size:13px;font-weight:600}
.sidebar-user .u-role{font-size:11px;color:var(--ink-3)}

/* ---------- 主区域 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 20px;
  border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);
}
.topbar h1{font-size:16.5px;font-weight:600}
.topbar .crumb{font-size:12px;color:var(--ink-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{
  display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;font-size:12.5px;
  background:var(--glass-strong);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
}
.pill b{color:var(--ink);font-weight:600}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,158,107,.18)}

.page{flex:1;display:none;min-height:0}
.page.active{display:flex;flex-direction:column}

/* ---------- 阶段进度条 ---------- */
.phase-bar{
  display:none;align-items:center;gap:0;padding:9px 18px;flex-wrap:nowrap;overflow-x:auto;
}
.phase-bar.show{display:flex;animation:msgIn .35s ease;border-bottom:1px solid var(--line)}
.phase-step{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.phase-node{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:600;background:rgba(255,255,255,.7);border:1.5px solid var(--line);color:var(--ink-3);
  transition:all .25s;
}
.phase-step .p-name{font-size:12.5px;color:var(--ink-3);white-space:nowrap;transition:color .25s}
.phase-step .p-name small{display:block;font-size:11px;color:var(--ink-3);opacity:.8;line-height:1.3}
.phase-link{width:30px;height:1.5px;background:var(--line);margin:0 10px;flex-shrink:0;transition:background .25s}
.phase-step.done .phase-node{background:var(--ok);border-color:var(--ok);color:#fff}
.phase-step.done .p-name{color:var(--ink-2)}
.phase-step.done + .phase-link{background:var(--ok)}
.phase-step.active .phase-node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(58,99,192,.15)}
.phase-step.active .p-name{color:var(--accent);font-weight:600}

/* ---------- 对话排产分屏 ---------- */
.split{flex:1;display:flex;gap:12px;padding:4px 20px 12px;min-height:0}
.chat-panel{
  width:400px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.85);border-radius:var(--r-lg);box-shadow:var(--shadow);
  min-height:0;
}
.chat-head{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.agent-ava{
  width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#3a63c0,#5d8ae0);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0;
}
.chat-head .t{font-size:13.5px;font-weight:600}
.chat-head .s{font-size:11.5px;color:var(--ok);display:flex;align-items:center;gap:5px}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:9px;max-width:100%;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .m-ava{width:24px;height:24px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:2px}
.msg.agent .m-ava{background:linear-gradient(135deg,#3a63c0,#5d8ae0)}
.msg.user{flex-direction:row-reverse}
.msg.user .m-ava{background:linear-gradient(135deg,#8aa5d8,#b6c6e8)}
.bubble{
  padding:8px 12px;border-radius:12px;font-size:13px;max-width:88%;
  background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(29,36,54,.05);
}
.msg.user .bubble{background:var(--accent);color:#fff;border-color:transparent}
.bubble .b-title{font-weight:600;margin-bottom:3px;font-size:13.5px}
.bubble .b-meta{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.mini-card{margin-top:6px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px}
.mini-card .mc-title{font-weight:600;font-size:12.5px;margin-bottom:5px;color:var(--ink)}
.mc-row{display:flex;justify-content:space-between;gap:14px;padding:2px 0;font-size:12.5px;color:var(--ink-2)}
.mc-row b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600;line-height:1.7}
.tag-ok{background:rgba(46,158,107,.12);color:var(--ok)}
.tag-warn{background:rgba(208,138,29,.13);color:var(--warn)}
.tag-info{background:var(--accent-soft);color:var(--accent)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 14px 8px}
.chip{
  font-size:12.5px;padding:6px 13px;border-radius:99px;cursor:pointer;
  background:var(--glass-strong);border:1px solid rgba(58,99,192,.25);color:var(--accent);
  transition:all .18s;user-select:none;
}
.chip:hover{background:var(--accent);color:#fff}
.input-bar{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.input-bar input{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;
  background:rgba(255,255,255,.8);outline:none;font-family:var(--font);color:var(--ink);
}
.input-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(58,99,192,.12)}
.send-btn{
  width:36px;height:36px;border-radius:11px;border:none;cursor:pointer;flex-shrink:0;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:background .18s;
}
.send-btn:hover{background:#2d4fa0}

/* ---------- 工作台 ---------- */
.workbench{
  flex:1;display:flex;flex-direction:column;min-width:0;
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.85);border-radius:var(--r-lg);box-shadow:var(--shadow);
  min-height:0;overflow:hidden;
}
.wb-head{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.wb-head .wb-title{font-size:14px;font-weight:600}
.wb-head .wb-sub{font-size:12px;color:var(--ink-3)}
.wb-tabs{margin-left:auto;display:flex;gap:4px;background:rgba(29,36,54,.05);border-radius:10px;padding:3px}
.wb-tab{font-size:12.5px;padding:5px 14px;border-radius:8px;cursor:pointer;color:var(--ink-2);user-select:none;transition:all .18s}
.wb-tab.active{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(29,36,54,.1)}
.wb-body{flex:1;overflow-y:auto;padding:13px 16px;min-height:0}
.wb-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-3);
}
.wb-empty .ico{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.panel{display:none;animation:msgIn .3s ease}
.panel.active{display:block}
.card{
  background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);
  padding:12px 14px;box-shadow:0 1px 5px rgba(29,36,54,.05);margin-bottom:10px;
}
.card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-title .ct-tag{margin-left:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{
  text-align:left;padding:6px 9px;color:var(--ink-3);font-weight:500;font-size:12px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tb td{padding:6px 9px;border-bottom:1px solid rgba(29,36,54,.05);white-space:nowrap}
table.tb tr:last-child td{border-bottom:none}
table.tb td b{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.check-row{display:flex;align-items:center;gap:9px;padding:6px 4px;border-bottom:1px solid rgba(29,36,54,.05);font-size:13px}
.check-row:last-child{border-bottom:none}
.check-ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff}
.check-ico.ok{background:var(--ok)}.check-ico.warn{background:var(--warn)}.check-ico.run{background:var(--accent)}
.check-row .c-detail{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.stat-card{background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:12px 14px;box-shadow:0 1px 5px rgba(29,36,54,.05)}
.stat-card .s-label{font-size:12px;color:var(--ink-3)}
.stat-card .s-val{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-card .s-val small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
.stat-card .s-foot{font-size:11.5px;margin-top:3px}
.up{color:var(--ok)}.down{color:var(--err)}
.prog{height:8px;border-radius:99px;background:rgba(29,36,54,.07);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3a63c0,#5d8ae0);transition:width .5s ease}
.cat-pill{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:99px;font-weight:600}
.cat-1{background:rgba(74,127,214,.13);color:#3a63c0}
.cat-2{background:rgba(53,162,165,.13);color:#238280}
.cat-3{background:rgba(201,138,61,.15);color:#a96f27}
.cat-4{background:rgba(124,111,208,.13);color:#6355b8}

/* 甘特图 */
.gantt-wrap{overflow-x:auto}
.gantt{min-width:1080px}
.g-row{display:flex;align-items:center;height:40px;border-bottom:1px solid rgba(29,36,54,.05)}
.g-row:last-child{border-bottom:none}
.g-label{width:108px;flex-shrink:0;font-size:12px;padding-right:10px}
.g-label b{display:block;font-size:12.5px}
.g-label span{font-size:11px;color:var(--ink-3)}
.g-track{flex:1;position:relative;height:26px;background:rgba(29,36,54,.035);border-radius:7px}
.g-block{
  position:absolute;top:2px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;
  font-size:11px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;cursor:default;
  box-shadow:0 1px 3px rgba(29,36,54,.18);opacity:0;transform:scaleX(.6);transform-origin:left;
  transition:opacity .5s,transform .5s;
}
.g-block.show{opacity:1;transform:none}
.g-block.changeover{
  background:repeating-linear-gradient(45deg,#a8b0c2,#a8b0c2 4px,#98a1b5 4px,#98a1b5 8px)!important;
  color:#4d5468;font-weight:500;
}
.g-axis{display:flex;margin-left:108px;font-size:11px;color:var(--ink-3);padding-top:6px}
.g-axis span{flex:1;text-align:left}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.load-bar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.load-bar .lb-name{width:110px;flex-shrink:0}
.load-bar .prog{flex:1}
.load-bar .lb-val{width:52px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* 其他页面 */
.board{padding:20px 26px;overflow-y:auto}
.hist-list{display:flex;flex-direction:column;gap:11px}
.hist-item{
  display:flex;align-items:center;gap:14px;background:var(--glass-strong);
  border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:14px 18px;cursor:pointer;
  box-shadow:0 1px 5px rgba(29,36,54,.05);transition:all .18s;
}
.hist-item:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.hist-item .h-title{font-size:13.5px;font-weight:600}
.hist-item .h-sub{font-size:12px;color:var(--ink-3)}
.hist-item .h-right{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-3)}
.section-title{font-size:14px;font-weight:600;margin:18px 0 10px}
/* ===== v2 增强：版本 / 洞察 / 首页 / 拖拽 / 谷电 ===== */
.ver-bar{display:flex;align-items:center;gap:6px;padding:2px 0 10px;flex-wrap:wrap}
.ver-tab{font-size:12.5px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);cursor:pointer;background:rgba(255,255,255,.6);transition:all .18s;user-select:none}
.ver-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.ver-tab.locked{opacity:.45;cursor:not-allowed}
.ver-tab .v-badge{font-size:10.5px;margin-left:4px;opacity:.75}
.ver-actions{margin-left:auto;display:flex;gap:6px}
.ver-btn{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid rgba(58,99,192,.3);color:var(--accent);background:rgba(255,255,255,.7);cursor:pointer;transition:all .18s}
.ver-btn:hover{background:var(--accent);color:#fff}
.ver-btn.on{background:var(--accent);color:#fff}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:10px 13px;box-shadow:0 1px 4px rgba(29,36,54,.05)}
.kpi .k-label{font-size:11.5px;color:var(--ink-3)}
.kpi .k-val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.5}
.kpi .k-val small{font-size:11px;font-weight:500;color:var(--ink-3)}
.kpi .k-delta{font-size:10.5px;font-weight:600;margin-left:6px;padding:0 6px;border-radius:99px}
.kpi .k-delta.up{background:rgba(46,158,107,.12);color:var(--ok)}
.kpi .k-delta.down{background:rgba(209,84,84,.12);color:var(--err)}
.g-band{position:absolute;top:0;bottom:0;background:rgba(58,99,192,.055);border-left:1.5px dashed rgba(58,99,192,.4);pointer-events:none;z-index:0}
.g-band-tag{position:absolute;top:3px;left:6px;font-size:10.5px;color:var(--accent);opacity:.85}
.g-track .g-block{z-index:1}
.g-block.draggable{cursor:grab;user-select:none}
.g-block.draggable:active{cursor:grabbing}
.g-block.dragging{opacity:.8;z-index:5;box-shadow:0 4px 14px rgba(29,36,54,.3)}
.g-block.conflict{outline:2px solid var(--err);outline-offset:1px;animation:blink 1.2s infinite}
@keyframes blink{50%{outline-color:rgba(209,84,84,.25)}}
.g-block.diff{outline:2px dashed var(--warn);outline-offset:1px}
.g-block.removed{opacity:.45;filter:grayscale(.7)}
.cmp-label{display:inline-block;font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px;margin:10px 0 4px}
.cmp-label.cur{background:var(--accent-soft);color:var(--accent)}
.cmp-label.base{background:rgba(29,36,54,.08);color:var(--ink-2)}
.insight{margin-top:12px}
.ins-card{background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:12px 14px;box-shadow:0 1px 4px rgba(29,36,54,.05)}
.ins-card h4{font-size:13px;margin-bottom:8px}
.ins-item{font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.65);border:1px solid var(--line);margin-bottom:8px;line-height:1.65}
.ins-item:last-child{margin-bottom:0}
.ins-item .ins-act{margin-top:6px;display:flex;gap:6px;align-items:center}
.ins-btn{font-size:11.5px;padding:3px 11px;border-radius:99px;border:1px solid rgba(58,99,192,.3);color:var(--accent);background:#fff;cursor:pointer;transition:all .15s;font-family:var(--font)}
.ins-btn:hover{background:var(--accent);color:#fff}
.ins-btn.ghost{border-color:var(--line);color:var(--ink-3)}
.ins-item.done{opacity:.55}
.home-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.home-greet{text-align:center}
.home-greet .hg-t{font-size:20px;font-weight:700;margin-bottom:4px}
.home-greet .hg-s{font-size:12.5px;color:var(--ink-3)}
.home-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-card{width:172px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:14px 15px;cursor:pointer;box-shadow:0 1px 5px rgba(29,36,54,.05);transition:all .18s}
.home-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(58,99,192,.3)}
.home-card .hc-t{font-size:13px;font-weight:600;margin:8px 0 3px}
.home-card .hc-s{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.home-card .hc-ico{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.home-recent{width:100%;max-width:560px}
.home-recent .hr-t{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.home-recent .hr-i{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:8px 12px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(29,36,54,.92);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:99px;z-index:99;animation:msgIn .25s ease;box-shadow:0 6px 24px rgba(29,36,54,.3)}
.mat-formula{font-size:12px;background:rgba(58,99,192,.07);border:1px dashed rgba(58,99,192,.3);border-radius:8px;padding:7px 10px;margin:6px 0;font-variant-numeric:tabular-nums}
/* 对话内空态欢迎区 */
.chat-home{margin:2px 2px 6px;animation:msgIn .35s ease}
.ch-greet{font-size:13px;font-weight:600;margin-bottom:2px}
.ch-sub{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.chat-home .home-cards{flex-direction:column;gap:8px;width:100%;flex-wrap:nowrap}
.chat-home .home-card{width:auto;display:flex;align-items:center;gap:10px;padding:10px 12px}
.chat-home .home-card .hc-ico{flex-shrink:0}
.chat-home .home-card .hc-t{margin:0 0 1px;font-size:12.5px}
.chat-home .home-card .hc-s{font-size:11px}
.chat-home .home-recent{margin-top:12px}
/* 物料决策卡 · 甘特图下方内嵌 */
.wb-body{position:relative;display:flex;padding:0}
.wb-body>.wb-main{flex:1;min-width:0;overflow-y:auto;padding:13px 16px}
.mat-panel{
  margin-top:12px;padding:13px 16px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 1px 5px rgba(29,36,54,.05);
  animation:msgIn .28s ease;
}
.mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.mat-panel .mp-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.mat-panel .mp-title{font-size:13.5px;font-weight:700;line-height:1.5}
.mat-panel .mp-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.mp-close{
  margin-left:auto;width:22px;height:22px;border-radius:7px;border:1px solid var(--line);
  background:rgba(255,255,255,.8);color:var(--ink-3);cursor:pointer;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mp-close:hover{color:var(--err);border-color:var(--err)}
.mp-sec{margin-top:13px}
.mp-sec-t{
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;
  padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:6px;
}
.calc-row{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.calc-row .c-op{width:14px;color:var(--ink-3);flex-shrink:0}
.calc-row .c-name{flex:1}
.calc-row b{font-weight:600;color:var(--ink)}
.calc-total{
  display:flex;justify-content:space-between;font-size:13px;font-weight:700;
  border-top:1px dashed rgba(29,36,54,.2);margin-top:5px;padding-top:6px;font-variant-numeric:tabular-nums;
}
.calc-total .c-val{color:var(--accent)}
.mp-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.mp-stat{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:9px;padding:7px 9px;text-align:center}
.mp-stat .ms-v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.mp-stat .ms-l{font-size:11px;color:var(--ink-3)}
.mp-stat.low .ms-v{color:var(--warn)}
/* 对话消息结构化 */
.ms-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ms-phase{font-size:10.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;letter-spacing:.03em;flex-shrink:0}
.ms-phase.ok{background:var(--ok)}
.ms-phase.q{background:#8b93a7}
.ms-title{font-size:13px;font-weight:700}
.ms-head .tag{margin-left:auto}
.ms-sec{border-top:1px dashed rgba(29,36,54,.12);margin-top:7px;padding-top:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(29,36,54,.15);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(29,36,54,.25)}
::-webkit-scrollbar-track{background:transparent}
</style>
